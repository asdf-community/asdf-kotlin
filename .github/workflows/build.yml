---
name: Build
permissions:
  contents: read
on:
  schedule:
    - cron: "0 23 * * 1"
  push:
    branches:
      - master
  pull_request:
jobs:
  plugin_test:
    name: asdf plugin test
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: asdf_install
        uses: asdf-vm/actions/setup@v4
      - name: asdf_plugin_test
        uses: asdf-vm/actions/plugin-test@v4
        with:
          skip_install: true
          command: kotlin -help
      - name: Set up Java 21 for legacy Kotlin
        id: java21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21.0.13+100000002.0.LTS'
          set-default: false
      - name: Set up Java 25 for current Kotlin
        id: java25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25.0.5+100000002.0.LTS'
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          path: kotlin
      - name: Move kotlin plugin to plugins dir
        run: |
          mkdir -p "${HOME}/.asdf/plugins/"
          mv kotlin "${HOME}/.asdf/plugins/"
      - name: Run kotlin specific tests
        env:
          JAVA_LEGACY_HOME: ${{ steps.java21.outputs.path }}
          JAVA_CURRENT_HOME: ${{ steps.java25.outputs.path }}
        run: |-
          bash "${HOME}/.asdf/plugins/kotlin/scripts/tests.bash"
